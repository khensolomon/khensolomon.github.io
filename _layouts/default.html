<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light" data-theme-pref="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">

  <!-- Resolve theme before first paint to avoid a flash. Must stay inline. -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('theme') || 'auto';
        var dark = pref === 'dark' ||
          (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.setAttribute('data-theme', dark ? 'dark' : 'light');
        r.setAttribute('data-theme-pref', pref);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>window.SITE = { searchUrl: "{{ '/search.json' | relative_url }}" };</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">[*]</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <nav class="topnav">
      <a href="{{ '/docs/getting-started/' | relative_url }}">Docs</a>
      {% include search.html %}
      <button class="theme-toggle" type="button" aria-label="Color theme: auto">
        <svg class="ico ico-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/>
        </svg>
        <svg class="ico ico-dark" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.5 14.2A8 8 0 0 1 9.8 3.5 8 8 0 1 0 20.5 14.2Z"/>
        </svg>
        <svg class="ico ico-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
